system:
  id: firewall
  title: 防火墙
  domain: it
  base_env: IT_FIREWALL_BASE
  menus:
    - id: rules
      title: 策略

components:
  schemas:
    FirewallRule:
      type: object
      required: [id, device, action]
      properties:
        id:
          type: string
        device:
          $ref: common.yaml#/schemas/ServerRef
        action:
          type: string
          enum: [allow, deny]
        port:
          type: integer
        comment:
          type: string

    FirewallRuleUpdate:
      allOf:
        - $ref: '#/components/schemas/FirewallRule'
        - type: object
          properties:
            change_ticket:
              type: string
              description: 变更工单号

operations:
  - id: list_rules
    menu: rules
    method: GET
    path: /api/rules
    description: 按机器 IP 列出防火墙策略
    mutation: false
    params:
      - name: device_ip
        in: query
        required: true
        schema:
          $ref: common.yaml#/schemas/IpAddress
    response:
      type: array
      items:
        $ref: '#/components/schemas/FirewallRule'

  - id: update_rule
    menu: rules
    method: PUT
    path: /api/rules/{id}
    description: 更新一条防火墙策略
    mutation: true
    params:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/components/schemas/FirewallRuleUpdate'
    response:
      $ref: '#/components/schemas/FirewallRule'
